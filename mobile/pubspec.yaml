name: nutricare
description: A Flutter mobile app for nutrition care and health tracking.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  cupertino_icons: ^1.0.2
  dio: ^5.9.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.2.0+1
  google_fonts: ^6.1.0
  http: ^1.1.0
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  open_file: ^3.3.2
  printing: ^5.11.1
  pdf: ^3.10.7
  http_parser: ^4.0.2
  typed_data: ^1.3.2
  image_picker: ^1.2.1
  flutter_local_notifications: ^17.0.0  # Change from ^16.3.3 to ^17.0.0
  share_plus: ^9.0.0
  url_launcher: ^6.2.0      # ✅ Ab sahi hai, ek hi dependencies block mein
  flutter_secure_storage: ^10.3.4

dev_dependencies:
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/Logo.png
    - assets/fonts/
